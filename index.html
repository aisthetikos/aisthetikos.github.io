<!DOCTYPE html>
<html>
<head>
  <title>Seconds Counter with Increment</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      font-family: monospace;
    }

    #counter {
      font-size: 2em;
      margin-bottom: 10px;
    }

    #increment {
      font-size: 1.2em;
    }
  </style>
</head>
<body>
  <div id="counter">00</div>
  <div id="increment">Increment: 1</div>
  <script src="script.js"></script>
</body>
</html>
